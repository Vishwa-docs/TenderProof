[project]
name = "tenderproof-engineering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "pydantic>=2,<3", "httpx>=0.27,<1", "z3-solver>=4.13,<5", "python-multipart>=0.0.18", "temporalio>=1.9,<2", "mcp>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
documents = ["docling>=2,<3"]

[tool.pytest.ini_options]
pythonpath = ["track_2b/src"]
testpaths = ["track_2b/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["track_2b/src"]
include = ["tenderproof*"]

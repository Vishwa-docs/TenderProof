pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 16m;
    # Re-resolve the API after Compose replaces its container during make run.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        set $api_upstream http://app:8000;
        location / {
            proxy_pass $api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Covers the bounded 12-window / 900s-per-role extraction budget.
            # Temporal continues durably if the client disconnects.
            proxy_read_timeout 43620s;
        }
    }
}

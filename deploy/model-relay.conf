pid /tmp/nginx.pid;
events { worker_connections 32; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 16m;
    server {
        listen 8081;
        # Docker Desktop reaches the host's private SSH tunnel. This is a fixed
        # destination, not a general internet proxy. No host port is published.
        location = /v1/chat/completions {
            limit_except POST { deny all; }
            proxy_pass http://host.docker.internal:18102;
            proxy_read_timeout 960s;
            proxy_buffering off;
        }
        location = /v1/models {
            limit_except GET { deny all; }
            proxy_pass http://host.docker.internal:18102;
        }
        location / { return 404; }
    }
}
